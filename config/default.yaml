# Huginn project configuration.
# Copy to .sdet.yaml in a project and adapt only what differs.

python:
  package_manager: poetry
  formatter: ruff
  linter: ruff
  type_checker: ty

testing:
  framework: pytest
  frameworks:
    pytest:
      runner: pytest
  profiles:
    default:
      - tests

ai:
  enabled: true
  provider: openai
  model: gpt-5
  instructions: []
  providers: {}
  usage:
    budget_tokens: 0
    cost_per_million_tokens: 0
