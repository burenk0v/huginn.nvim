# Huginn project configuration.
# Copy to .sdet.yaml in a project and adapt only what differs.

python:
  package_manager: poetry
  formatter: ruff
  linter: ruff
  type_checker: ty

testing:
  framework: pytest
  frameworks:
    pytest:
      runner: pytest
  profiles:
    default:
      - tests
  # Optional full command overrides. Arguments from profiles/current-file runs
  # are appended to these commands.
  commands:
    # test:
    #   - make
    #   - test
    # check:
    #   - make
    #   - check

keymaps:
  # Notepad++-style workflow shortcuts for running tests/checks.
  preset: notepadpp
  run: <F5>
  run_file: <S-F5>
  check: <C-F5>
  profile: <F6>
  nearest: <F9>
  debug: <C-F9>
  args: <S-F6>

ai:
  enabled: true
  provider: openai
  model: gpt-5
  instructions: []
  providers: {}
  usage:
    budget_tokens: 0
    cost_per_million_tokens: 0
