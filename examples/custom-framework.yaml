# Example for a team with a custom test framework.
# Huginn intentionally does not hard-code framework-specific conventions.
# The adapter named "my-framework" can consume the runner option below.

python:
  package_manager: poetry
  formatter: ruff
  linter: ruff
  type_checker: ty

testing:
  framework: my-framework
  frameworks:
    my-framework:
      runner: my-test-command
  profiles:
    default:
      - tests
    api:
      - tests/api
      - --framework-config
      - config/api.yaml
