name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Validate Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -name '*.lua' -not -path './.git/*' -print0 |
            xargs -0 -n1 luac5.1 -p

      - name: Validate JSON
        run: python -m json.tool config/schema.json >/dev/null

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        run: |
          curl -LO https://github.com/neovim/neovim/releases/download/v0.11.6/nvim-linux-x86_64.tar.gz
          sudo tar -C /opt -xzf nvim-linux-x86_64.tar.gz
          sudo ln -sf /opt/nvim-linux-x86_64/bin/nvim /usr/local/bin/nvim

      - name: Install YAML parser
        run: git clone --depth 1 https://github.com/jedi-knights/yaml.nvim.git /tmp/yaml.nvim

      - name: Run smoke tests
        run: |
          nvim --headless -u NONE \
            --cmd "set rtp^=$PWD" \
            --cmd "set rtp^=/tmp/yaml.nvim" \
            -c "luafile tests/smoke_config.lua" \
            -c "luafile tests/smoke_init.lua" \
            -c "luafile tests/smoke_auth.lua" \
            -c "qa!"
