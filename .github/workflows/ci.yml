name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Validate Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -name '*.lua' -not -path './.git/*' -print0 |
            xargs -0 -n1 lua5.1 -p

      - name: Validate JSON
        run: python -m json.tool config/schema.json >/dev/null
